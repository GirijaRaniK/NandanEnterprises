<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Orders | Nandan Enterprises</title>

  <meta
    name="description"
    content="View your orders and payment details."
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #faf9f5;
      color: #162b4d;
      line-height: 1.6;
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      background: #162b4d;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .logo {
      color: #d4af37;
      font-size: 22px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-menu a {
      color: #ffffff;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      transition: 0.3s;
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      background: #b38a2e;
      color: #ffffff;
    }

    .cart-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      margin-left: 3px;
      border-radius: 50%;
      background: #d4af37;
      color: #162b4d;
      font-size: 11px;
      font-weight: 700;
    }

    /* =========================
       PAGE HEADER
    ========================= */

    .page-header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    .page-header h1 {
      font-size: 34px;
      margin-bottom: 10px;
      color: #162b4d;
    }

    .page-header p {
      color: #666;
      font-size: 15px;
    }

    /* =========================
       ORDERS CONTAINER
    ========================= */

    .orders-container {
      width: 92%;
      max-width: 1100px;
      margin: 0 auto 60px;
    }

    /* =========================
       EMPTY ORDERS
    ========================= */

    .empty-orders {
      background: #ffffff;
      border: 1px solid #e3d7b8;
      border-radius: 12px;
      padding: 60px 20px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(22, 43, 77, 0.06);
    }

    .empty-orders i {
      font-size: 55px;
      color: #b38a2e;
      margin-bottom: 15px;
    }

    .empty-orders h2 {
      margin-bottom: 10px;
      color: #162b4d;
    }

    .empty-orders p {
      color: #777;
      margin-bottom: 25px;
    }

    .shop-button {
      display: inline-block;
      background: #162b4d;
      color: #ffffff;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 6px;
      font-weight: 600;
      transition: 0.3s;
    }

    .shop-button:hover {
      background: #b38a2e;
    }

    /* =========================
       ORDER CARD
    ========================= */

    .order-card {
      background: #ffffff;
      border: 1px solid #e3d7b8;
      border-radius: 12px;
      margin-bottom: 25px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(22, 43, 77, 0.06);
    }

    .order-header {
      background: #162b4d;
      color: #ffffff;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-id {
      font-weight: 700;
    }

    .order-date {
      font-size: 13px;
      opacity: 0.9;
    }

    .order-body {
      padding: 22px;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 22px;
    }

    .info-box {
      background: #faf9f5;
      border: 1px solid #eee4c9;
      padding: 14px;
      border-radius: 8px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      color: #777;
      margin-bottom: 4px;
    }

    .info-value {
      font-weight: 600;
      color: #162b4d;
    }

    .status-paid {
      color: #238636;
    }

    .status-pending {
      color: #b7791f;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-title {
      font-size: 18px;
      margin-bottom: 12px;
      color: #162b4d;
    }

    .order-product {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 14px 0;
      border-bottom: 1px solid #eeeeee;
    }

    .order-product:last-child {
      border-bottom: none;
    }

    .product-image {
      width: 70px;
      height: 70px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid #e3d7b8;
      background: #faf9f5;
    }

    .product-details {
      flex: 1;
    }

    .product-name {
      font-weight: 600;
      color: #162b4d;
      margin-bottom: 4px;
    }

    .product-quantity {
      color: #777;
      font-size: 13px;
    }

    .product-price {
      font-weight: 600;
      color: #162b4d;
      white-space: nowrap;
    }

    /* =========================
       ORDER FOOTER
    ========================= */

    .order-footer {
      background: #faf9f5;
      border-top: 1px solid #eee4c9;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .order-status {
      font-weight: 600;
    }

    .total-label {
      color: #777;
      margin-right: 8px;
    }

    .total-amount {
      font-size: 21px;
      font-weight: 700;
      color: #162b4d;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #162b4d;
      color: #ffffff;
      text-align: center;
      padding: 25px 15px;
      font-size: 13px;
    }

    footer span {
      color: #d4af37;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {

      .navbar {
        justify-content: center;
      }

      .nav-menu {
        justify-content: center;
      }

      .page-header {
        padding-top: 35px;
      }

      .page-header h1 {
        font-size: 28px;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-product {
        align-items: flex-start;
      }

      .product-price {
        font-size: 14px;
      }

    }

    @media (max-width: 500px) {

      .nav-menu {
        gap: 3px;
      }

      .nav-menu a {
        font-size: 12px;
        padding: 7px 8px;
      }

      .order-header {
        padding: 15px;
      }

      .order-body {
        padding: 15px;
      }

      .order-footer {
        padding: 15px;
      }

      .product-image {
        width: 55px;
        height: 55px;
      }

    }

  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================= -->

  <header class="navbar">

    <a href="index1.html" class="logo">
      Nandan Enterprises
    </a>

    <nav class="nav-menu">

      <a href="index1.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

      <a href="custom-printing.html">
        Custom Printing
      </a>

      <a href="bulk-orders.html">
        Bulk Orders
      </a>

      <a href="about.html">
        About Us
      </a>

      <a href="contact.html">
        Contact
      </a>

      <a href="cart.html">
        <i class="bi bi-cart3"></i>
        Cart
        <span class="cart-count">0</span>
      </a>

      <a href="orders.html" class="active">
        <i class="bi bi-box-seam"></i>
        Orders
      </a>

    </nav>

  </header>


  <!-- =========================
       PAGE HEADER
  ========================= -->

  <section class="page-header">

    <h1>My Orders</h1>

    <p>
      View your previous orders and payment details
    </p>

  </section>


  <!-- =========================
       ORDERS
  ========================= -->

  <main class="orders-container">

    <div id="ordersContainer"></div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    © 2026
    <span>Nandan Enterprises</span>.
    All Rights Reserved.

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    /* =========================
       CART COUNT
    ========================= */

    function updateCartCount() {

      const cart =
        JSON.parse(localStorage.getItem("nandan_cart")) || [];

      const count = cart.reduce(function(total, item) {

        return total + (Number(item.quantity) || 1);

      }, 0);

      document
        .querySelectorAll(".cart-count")
        .forEach(function(element) {

          element.textContent = count;

        });

    }


    /* =========================
       FORMAT CURRENCY
    ========================= */

    function formatCurrency(amount) {

      return new Intl.NumberFormat("en-IN", {

        style: "currency",

        currency: "INR",

        maximumFractionDigits: 2

      }).format(Number(amount) || 0);

    }


    /* =========================
       FORMAT DATE
    ========================= */

    function formatDate(dateValue) {

      if (!dateValue) {
        return "N/A";
      }

      const date = new Date(dateValue);

      if (isNaN(date.getTime())) {
        return dateValue;
      }

      return date.toLocaleString("en-IN", {

        day: "2-digit",

        month: "short",

        year: "numeric",

        hour: "2-digit",

        minute: "2-digit"

      });

    }


    /* =========================
       LOAD ORDERS
    ========================= */

    function loadOrders() {

      const orders =
        JSON.parse(localStorage.getItem("nandan_orders")) || [];

      const container =
        document.getElementById("ordersContainer");


      /* =========================
         NO ORDERS
      ========================= */

      if (orders.length === 0) {

        container.innerHTML = `

          <div class="empty-orders">

            <i class="bi bi-box-seam"></i>

            <h2>No Orders Yet</h2>

            <p>
              You haven't placed any orders yet.
            </p>

            <a
              href="products.html"
              class="shop-button"
            >
              Continue Shopping
            </a>

          </div>

        `;

        return;

      }


      /* =========================
         DISPLAY ORDERS
      ========================= */

      container.innerHTML = "";


      /* Newest orders first */

      const sortedOrders = [...orders].reverse();


      sortedOrders.forEach(function(order) {

        const items = order.items || [];


        let productsHTML = "";


        items.forEach(function(item) {

          const quantity =
            Number(item.quantity) || 1;

          const price =
            Number(item.price) || 0;

          const itemTotal =
            price * quantity;


          productsHTML += `

            <div class="order-product">

              ${
                item.image

                  ? `<img
                      src="${item.image}"
                      class="product-image"
                      alt="${item.name || "Product"}"
                    >`

                  : `<div
                      class="product-image"
                      style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                      "
                    >
                      <i class="bi bi-image"></i>
                    </div>`
              }

              <div class="product-details">

                <div class="product-name">

                  ${item.name || "Product"}

                </div>

                <div class="product-quantity">

                  Quantity: ${quantity}

                </div>

              </div>

              <div class="product-price">

                ${formatCurrency(itemTotal)}

              </div>

            </div>

          `;

        });


        const paymentStatus =
          order.paymentStatus || "Unknown";


        const paymentClass =
          paymentStatus.toLowerCase() === "paid"

            ? "status-paid"

            : "status-pending";


        const orderHTML = `

          <div class="order-card">

            <div class="order-header">

              <div class="order-id">

                Order ID:
                ${order.orderId || "N/A"}

              </div>

              <div class="order-date">

                ${formatDate(order.date)}

              </div>

            </div>


            <div class="order-body">

              <div class="order-info">

                <div class="info-box">

                  <span class="info-label">
                    Payment Status
                  </span>

                  <span class="info-value ${paymentClass}">
                    ${paymentStatus}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Order Status
                  </span>

                  <span class="info-value">
                    ${order.orderStatus || "Order Placed"}
                  </span>

                </div>


                <div class="info-box">

                  <span class="info-label">
                    Payment ID
                  </span>

                  <span class="info-value">

                    ${
                      order.razorpayPaymentId
                        || "N/A"
                    }

                  </span>

                </div>

              </div>


              <h3 class="products-title">
                Products
              </h3>

              ${productsHTML}

            </div>


            <div class="order-footer">

              <div class="order-status">

                <i class="bi bi-check-circle"></i>

                ${
                  order.orderStatus
                    || "Order Placed"
                }

              </div>


              <div>

                <span class="total-label">
                  Total:
                </span>

                <span class="total-amount">

                  ${formatCurrency(order.amount)}

                </span>

              </div>

            </div>

          </div>

        `;


        container.insertAdjacentHTML(
          "beforeend",
          orderHTML
        );

      });

    }


    /* =========================
       INITIALIZE
    ========================= */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        updateCartCount();

        loadOrders();

      }
    );

  </script>

</body>
</html>
